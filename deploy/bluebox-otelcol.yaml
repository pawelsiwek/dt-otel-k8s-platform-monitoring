# Bluebox K8s OTel collector - everything for one cluster in one file.
# Generated from config/*.yaml and deploy/k8s/*.yaml; image pinned by digest.
# Per-cluster values (endpoint, cluster name/uid, Authorization header) come from Secret dt-otelcol-secret,
# created separately with kubectl (see RUNBOOK). No templating needed.
apiVersion: v1
kind: Namespace
metadata:
  name: dt-otelcol
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dt-otelcol
  namespace: dt-otelcol
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dt-otelcol
rules:
- apiGroups:
  - ''
  resources:
  - nodes/stats
  - nodes/proxy
  - nodes/metrics
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - events
  - namespaces
  - namespaces/status
  - nodes
  - nodes/spec
  - pods
  - pods/status
  - replicationcontrollers
  - replicationcontrollers/status
  - resourcequotas
  - services
  - persistentvolumes
  - persistentvolumeclaims
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - events
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dt-otelcol
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dt-otelcol
subjects:
- kind: ServiceAccount
  name: dt-otelcol
  namespace: dt-otelcol
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dt-otelcol-config
  namespace: dt-otelcol
data:
  deployment.yaml: |
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 60s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, pods]
        # Bluebox: metrics queried by mission control / dt-obs-otel-kubernetes and the
        # restart cause (OOMKilled, CrashLoopBackOff, Evicted, ...). Off by default.
        metrics:
          k8s.node.condition:
            enabled: true
          k8s.container.status.reason:
            enabled: true
          k8s.pod.status_reason:
            enabled: true

      # Topology receiver: all objects in pull mode so every pod is discovered on
      # each 120s cycle regardless of when it was created vs when the collector started.
      # Watch mode only fires for changes after the watch begins, so pre-existing pods
      # are invisible to it — pull mode is required for complete discovery.
      k8s_objects/topology:
        auth_type: serviceAccount
        objects:
          - name: namespaces
            mode: pull
            interval: 120s
          - name: nodes
            mode: pull
            interval: 120s
          - name: pods
            mode: pull
            interval: 120s
          - name: services
            mode: pull
            interval: 120s
          - name: deployments
            group: apps
            mode: pull
            interval: 120s
          - name: statefulsets
            group: apps
            mode: pull
            interval: 120s
          - name: daemonsets
            group: apps
            mode: pull
            interval: 120s
          - name: replicasets
            group: apps
            mode: pull
            interval: 120s

      # Events receiver: watch mode only — pods for OOM-kill detection,
      # K8s events for KUBERNETES_EVENT Davis ingestion.
      k8s_objects/events:
        auth_type: serviceAccount
        objects:
          - name: pods
            mode: watch
          - name: events
            group: ""
            mode: watch          # Phase F: watch K8s events API for KUBERNETES_EVENT ingestion

    processors:
      memory_limiter:
        limit_mib: 400
        spike_limit_mib: 100
        check_interval: 5s

      # Stamps k8s.cluster.name and k8s.cluster.uid from OTEL_RESOURCE_ATTRIBUTES env var.
      resourcedetection:
        detectors: [env]
        timeout: 2s
        override: false

      # Enriches k8s_cluster container metrics with workload owner names (deployment,
      # daemonset, etc.) by looking up the pod by k8s.pod.uid in the k8s API.
      # Required because k8sclusterreceiver does not include owner references on
      # container-level resources — only pod-level resources carry them natively.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.job.name
            - k8s.cronjob.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid

      # Splits a shared ResourceLogs into one ResourceLogs per distinct k8s.pod.uid
      # value before k8sattributes runs. k8sobjects pull mode batches all pods in a
      # namespace into a single ResourceLogs; transform/topology writes per-pod
      # attributes to the shared resource, leaving only the last pod's UID.
      # groupbyattrs/pod reads the per-record k8s.pod.uid attribute (set by
      # transform/topology on log record attributes) and promotes it to a fresh
      # per-pod resource so k8sattributes resolves the correct workload metadata.
      # Non-pod records (no k8s.pod.uid) are collected into a separate resource and
      # pass through unchanged.
      groupbyattrs/pod:
        keys: [k8s.pod.uid]

      # Derives k8s.workload.name / k8s.workload.kind from the kind-specific resource
      # attribute emitted by k8sclusterreceiver (e.g. k8s.deployment.name → workload.name).
      # log_statements promote workload names from resource.attributes (set by k8sattributes
      # on pod records) into log record attributes for OpenPipeline entity resolution.
      transform/workload_dims:
        metric_statements:
          - context: resource
            statements:
              # Cluster identity — stamped from env vars set in the K8s Deployment manifest.
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
              - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.kind"], "deployment") where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "statefulset") where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "cronjob") where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "daemonset") where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.job.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "job") where attributes["k8s.job.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "replicaset") where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.kind"] == nil
        log_statements:
          - context: log
            statements:
              # Promote workload names from resource.attributes (written by k8sattributes on pod
              # records) into log record attributes so OpenPipeline entity matchers can read them.
              - set(attributes["k8s.deployment.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.statefulset.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.statefulset.name"] != nil
              - set(attributes["k8s.daemonset.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.daemonset.name"] != nil
              - set(attributes["k8s.replicaset.name"], resource.attributes["k8s.replicaset.name"]) where resource.attributes["k8s.replicaset.name"] != nil
              - set(attributes["k8s.job.name"], resource.attributes["k8s.job.name"]) where resource.attributes["k8s.job.name"] != nil
              - set(attributes["k8s.cronjob.name"], resource.attributes["k8s.cronjob.name"]) where resource.attributes["k8s.cronjob.name"] != nil
              # Workload name/kind cascade — same priority order as metric_statements.
              # For workload records (deployment etc.) k8s.workload.name is already set by
              # transform/topology so these are no-ops; they only fire on pod records.
              - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "deployment") where attributes["k8s.deployment.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "statefulset") where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "cronjob") where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "daemonset") where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.job.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "job") where attributes["k8s.job.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "replicaset") where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.kind"] == nil

      batch:
        timeout: 10s
        send_batch_size: 1000

      # Claims k8s metrics for the extension's metrics ingest source. That source
      # routes to k8s-otel-metrics-enrichment by default; repoint it at
      # k8s-otel-metrics-extraction (or disable it) in DT without redeploying.
      transform/openpipeline_source_metrics:
        metric_statements:
          - context: resource
            statements:
              - set(attributes["dt.openpipeline.source"], "custom:dt-k8s-otel-topology")

      # Tags logs with the extension's source so the logs routing rule can match on
      # it instead of enumerating event.provider values. Note this does NOT let an
      # extension ingest source claim the data — for that DT matches the server-side
      # ingest path, not this attribute — but a routing rule can read it fine.
      # Runs last so records fanned out by dtk8stopology / dtk8seventsprocessor
      # are tagged too.
      transform/openpipeline_source_logs:
        log_statements:
          - context: log
            statements:
              - set(attributes["dt.openpipeline.source"], "custom:dt-k8s-otel-topology")

      # Phase 1: maps k8sobjects/topology pull-mode records to KUBERNETES_OTEL_TOPO topology
      # events via stock OTTL.  Each record's body IS the K8s object (no {type,object} wrapper).
      # resource context stamps cluster identity; log context sets per-kind topology attrs,
      # k8s.object (full JSON), and resource.attributes["k8s.pod.uid"] for k8sattributes.
      transform/topology:
        log_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
          - context: log
            statements:
              # Common topology fields on every record.
              - set(attributes["event.provider"], "KUBERNETES_OTEL_TOPO")
              - set(attributes["event.kind"], "topology_node")
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
              - set(attributes["k8s.object"], String(body))
              # Namespace
              - set(attributes["k8s.topo.node.type"], "K8S_NAMESPACE") where attributes["k8s.resource.name"] == "namespaces"
              - set(attributes["k8s.namespace.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "namespaces"
              - set(attributes["k8s.namespace.uid"], body["metadata"]["uid"]) where attributes["k8s.resource.name"] == "namespaces"
              # Node
              - set(attributes["k8s.topo.node.type"], "K8S_NODE") where attributes["k8s.resource.name"] == "nodes"
              - set(attributes["k8s.node.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "nodes"
              - set(attributes["k8s.node.uid"], body["metadata"]["uid"]) where attributes["k8s.resource.name"] == "nodes"
              - set(attributes["k8s.node.system_uuid"], body["status"]["nodeInfo"]["systemUUID"]) where attributes["k8s.resource.name"] == "nodes" and body["status"]["nodeInfo"]["systemUUID"] != nil
              # Pod — workload attrs filled in later by k8sattributes + transform/workload_dims.
              - set(attributes["k8s.topo.node.type"], "K8S_POD") where attributes["k8s.resource.name"] == "pods"
              - set(attributes["k8s.pod.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "pods"
              - set(attributes["k8s.pod.uid"], body["metadata"]["uid"]) where attributes["k8s.resource.name"] == "pods"
              - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where attributes["k8s.resource.name"] == "pods" and body["metadata"]["namespace"] != nil
              - set(attributes["k8s.pod.phase"], body["status"]["phase"]) where attributes["k8s.resource.name"] == "pods" and body["status"]["phase"] != nil
              - set(attributes["k8s.node.name"], body["spec"]["nodeName"]) where attributes["k8s.resource.name"] == "pods" and body["spec"]["nodeName"] != nil
              # Deployment
              - set(attributes["k8s.topo.node.type"], "K8S_DEPLOYMENT") where attributes["k8s.resource.name"] == "deployments"
              - set(attributes["k8s.deployment.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "deployments"
              - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where attributes["k8s.resource.name"] == "deployments"
              - set(attributes["k8s.workload.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "deployments"
              - set(attributes["k8s.workload.kind"], "deployment") where attributes["k8s.resource.name"] == "deployments"
              # StatefulSet
              - set(attributes["k8s.topo.node.type"], "K8S_STATEFULSET") where attributes["k8s.resource.name"] == "statefulsets"
              - set(attributes["k8s.statefulset.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "statefulsets"
              - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where attributes["k8s.resource.name"] == "statefulsets"
              - set(attributes["k8s.workload.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "statefulsets"
              - set(attributes["k8s.workload.kind"], "statefulset") where attributes["k8s.resource.name"] == "statefulsets"
              # DaemonSet
              - set(attributes["k8s.topo.node.type"], "K8S_DAEMONSET") where attributes["k8s.resource.name"] == "daemonsets"
              - set(attributes["k8s.daemonset.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "daemonsets"
              - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where attributes["k8s.resource.name"] == "daemonsets"
              - set(attributes["k8s.workload.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "daemonsets"
              - set(attributes["k8s.workload.kind"], "daemonset") where attributes["k8s.resource.name"] == "daemonsets"
              # ReplicaSet
              - set(attributes["k8s.topo.node.type"], "K8S_REPLICASET") where attributes["k8s.resource.name"] == "replicasets"
              - set(attributes["k8s.replicaset.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "replicasets"
              - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where attributes["k8s.resource.name"] == "replicasets"
              - set(attributes["k8s.workload.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "replicasets"
              - set(attributes["k8s.workload.kind"], "replicaset") where attributes["k8s.resource.name"] == "replicasets"
              # Service
              - set(attributes["k8s.topo.node.type"], "K8S_SERVICE") where attributes["k8s.resource.name"] == "services"
              - set(attributes["k8s.service.name"], body["metadata"]["name"]) where attributes["k8s.resource.name"] == "services"
              - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where attributes["k8s.resource.name"] == "services"

      # Phase 2: container fan-out only — emits one CONTAINER record per
      # containers[]/initContainers[] element enriched with k8s.container.image.
      # All other entity types are handled by transform/topology + k8sattributes upstream.
      dtk8stopology:
        cluster_name: "${env:K8S_CLUSTER_NAME}"
        cluster_uid: "${env:K8S_CLUSTER_UID}"

      # Phase 3: K8s Event watch records → KUBERNETES_EVENT Davis event attrs via OTTL.
      # Watch mode: body = {type, object: <Event>}. All statements gate on k8s.resource.name
      # == "events" and body["type"] != "DELETED". dtk8seventsprocessor (below) then
      # applies throttle and passes records through; pod records are routed to OOM fan-out.
      transform/k8sevents:
        log_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
          - context: log
            statements:
              - set(attributes["event.provider"], "KUBERNETES_EVENT") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["event.kind"], "DAVIS_EVENT") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["event.type"], "CUSTOM_INFO") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["event.status"], "CLOSED") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["dt.davis.is_merging_allowed"], false) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["dt.kubernetes.event.uid"], body["object"]["metadata"]["uid"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["metadata"]["uid"] != nil
              - set(attributes["dt.kubernetes.event.reason"], body["object"]["reason"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["reason"] != nil
              - set(attributes["event.group_label"], body["object"]["reason"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["reason"] != nil
              - set(attributes["dt.kubernetes.event.message"], body["object"]["message"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["message"] != nil
              - set(attributes["event.category"], "ERROR") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["type"] == "Warning"
              - set(attributes["event.category"], "INFO") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["type"] != "Warning"
              - set(attributes["dt.kubernetes.event.involved_object.kind"], body["object"]["involvedObject"]["kind"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["involvedObject"]["kind"] != nil
              - set(attributes["dt.kubernetes.event.involved_object.name"], body["object"]["involvedObject"]["name"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["involvedObject"]["name"] != nil
              - set(attributes["k8s.namespace.name"], body["object"]["involvedObject"]["namespace"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["involvedObject"]["namespace"] != nil
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}") where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED"
              - set(attributes["dt.kubernetes.event.count"], body["object"]["count"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["count"] != nil
              - set(attributes["dt.kubernetes.event.first_seen"], body["object"]["firstTimestamp"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["firstTimestamp"] != nil
              - set(attributes["dt.kubernetes.event.last_seen"], body["object"]["lastTimestamp"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["lastTimestamp"] != nil
              - set(attributes["event.start"], body["object"]["lastTimestamp"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["lastTimestamp"] != nil
              - set(attributes["event.end"], body["object"]["lastTimestamp"]) where attributes["k8s.resource.name"] == "events" and body["type"] != "DELETED" and body["object"]["lastTimestamp"] != nil

      # Phase 3: throttles KUBERNETES_EVENT records (mapped by transform/k8sevents) and
      # fans out OOM-kill Pod MODIFIED watch events → KUBERNETES_INFERRED_EVENT.
      # UID dedup dropped (Davis deduplicates events natively).
      dtk8seventsprocessor:
        cluster_name: "${env:K8S_CLUSTER_NAME}"
        cluster_uid: "${env:K8S_CLUSTER_UID}"
        max_events_per_entity_per_hour: 1000
        max_events_per_cluster_per_hour: 10000

    connectors:
      # Phase G: MetricsToLogs connector — evaluates anomaly-detection rules
      # against incoming metric data points and emits KUBERNETES_ANOMALY_DETECTION
      # Davis event log records when value × time thresholds fire.
      alertingengine:
        window_size_seconds: 60
        grace_period_seconds: 0
        rules:
          - id: container_crash_loop
            metric_key: k8s.container.restarts
            group_by: [k8s.cluster.uid, k8s.namespace.name, k8s.workload.name, k8s.container.name]
            aggregation: max
            threshold: {operator: ">", value: 5}
            time_trigger_count: 2
            event_type: AVAILABILITY_EVENT
            event_name: "Container crash loop detected"
            event_description: "Container {{k8s.container.name}} restarted {{value}} times in the last {{window}}s"

          - id: node_not_ready
            metric_key: k8s.node.condition_ready
            group_by: [k8s.cluster.uid, k8s.node.name]
            aggregation: min
            threshold: {operator: "<", value: 1}
            time_trigger_count: 2
            event_type: AVAILABILITY_EVENT
            event_name: "Node not ready"
            event_description: "Node {{k8s.node.name}} has been not-ready for {{window}}s"

          - id: deployment_unavailable
            metric_key: k8s.deployment.available
            group_by: [k8s.cluster.uid, k8s.namespace.name, k8s.deployment.name]
            aggregation: min
            threshold: {operator: "<", value: 1}
            time_trigger_count: 3
            event_type: AVAILABILITY_EVENT
            event_name: "Deployment has no available replicas"
            event_description: "Deployment {{k8s.deployment.name}} in {{k8s.namespace.name}} has 0 available replicas"

          - id: daemonset_misscheduled
            metric_key: k8s.daemonset.misscheduled_nodes
            group_by: [k8s.cluster.uid, k8s.namespace.name, k8s.daemonset.name]
            aggregation: max
            threshold: {operator: ">", value: 0}
            time_trigger_count: 2
            event_type: ERROR_EVENT
            event_name: "DaemonSet has misscheduled pods"
            event_description: "DaemonSet {{k8s.daemonset.name}} has {{value}} misscheduled pods"

    exporters:
      # Authorization header value from Secret key "authorization": "Bearer <dt0s16 platform token>" or "Api-Token <dt0c01 classic token>".
      otlphttp/metrics:
        endpoint: "${env:DT_ENDPOINT}"
        headers:
          Authorization: "${env:DT_AUTHORIZATION}"

      # Logs/topology events: same header.
      otlphttp/logs:
        endpoint: "${env:DT_ENDPOINT}"
        headers:
          Authorization: "${env:DT_AUTHORIZATION}"

      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resourcedetection, k8sattributes, transform/workload_dims, transform/openpipeline_source_metrics, batch]
          exporters: [otlphttp/metrics, debug, alertingengine]

        # Topology pipeline: stock OTTL maps raw k8sobjects → KUBERNETES_OTEL_TOPO attrs;
        # k8sattributes resolves pod→workload; workload_dims promotes to record attrs;
        # dtk8stopology fans out pod records into CONTAINER records with image enrichment.
        logs/topology:
          receivers: [k8s_objects/topology]
          processors: [memory_limiter, transform/topology, groupbyattrs/pod, k8sattributes, transform/workload_dims, dtk8stopology, transform/openpipeline_source_logs, batch]
          exporters: [otlphttp/logs, debug]

        # Events pipeline: transform/k8sevents maps K8s Event objects → KUBERNETES_EVENT attrs;
        # dtk8seventsprocessor applies per-entity/cluster throttle and fans out OOM kills.
        logs/events:
          receivers: [k8s_objects/events]
          processors: [memory_limiter, transform/k8sevents, dtk8seventsprocessor, transform/openpipeline_source_logs, batch]
          exporters: [otlphttp/logs, debug]

        # Phase G alerting pipeline — KUBERNETES_ANOMALY_DETECTION events from connector.
        logs/alerts:
          receivers: [alertingengine]
          processors: [batch]
          exporters: [otlphttp/logs, debug]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dt-otelcol-daemonset-config
  namespace: dt-otelcol
data:
  daemonset.yaml: |
    receivers:
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 60s
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
        metrics:
          k8s.pod.network.io:
            enabled: true
          k8s.pod.network.errors:
            enabled: true
          # Monotonic cumulative sum — DT rejects it; disable at source.
          k8s.node.cpu.time:
            enabled: false
        extra_metadata_labels:
          - k8s.volume.type

      # Scrapes kubelet's cAdvisor endpoint for CPU throttling metrics not
      # available via the stats/summary API used by kubeletstats.
      prometheus/cadvisor:
        config:
          scrape_configs:
            - job_name: cadvisor
              scheme: https
              scrape_interval: 60s
              tls_config:
                insecure_skip_verify: true
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets: ["${env:K8S_NODE_IP}:10250"]
              metrics_path: /metrics/cadvisor
              metric_relabel_configs:
                # Keep only CPU throttling counters and CPU usage.
                - source_labels: [__name__]
                  regex: 'container_cpu_cfs_(throttled_seconds|throttled_periods|periods)_total|container_cpu_usage_seconds_total'
                  action: keep
                # Drop empty container names (node-level cgroup rows) and the POD sandbox.
                - source_labels: [container]
                  regex: '^$|^POD$'
                  action: drop
                # Strip _total suffix so the Prometheus receiver ingests these as Gauge
                # rather than Sum[monotonic]. Dynatrace's OTLP endpoint on this tenant
                # silently drops Sum[monotonic] metrics; storing as Gauge with cumulative
                # semantics is a known workaround (use derivative() in DQL for rates).
                - source_labels: [__name__]
                  regex: '(.+)_total'
                  target_label: __name__
                  replacement: '$$1'

      # Bluebox: container stdout/stderr from /var/log/pods (CRI format on containerd/AKS).
      # The container operator derives k8s.namespace.name, k8s.pod.name, k8s.pod.uid,
      # k8s.container.name and k8s.container.restart_count from the file path.
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/dt-otelcol_*/*/*.log]
        include_file_path: true
        start_at: end
        operators:
          - id: container-parser
            type: container

    processors:
      memory_limiter:
        limit_mib: 400
        spike_limit_mib: 100
        check_interval: 5s

      # Enriches kubeletstats metrics with pod/workload metadata from K8s API.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.namespace.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid

      transform/workload_dims:
        metric_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
              - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.kind"], "deployment") where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "statefulset") where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "cronjob") where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "daemonset") where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.job.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "job") where attributes["k8s.job.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "replicaset") where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.kind"] == nil
        log_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
              - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.kind"], "deployment") where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "statefulset") where attributes["k8s.statefulset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "cronjob") where attributes["k8s.cronjob.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "daemonset") where attributes["k8s.daemonset.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.job.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "job") where attributes["k8s.job.name"] != nil and attributes["k8s.workload.kind"] == nil
              - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.name"] == nil
              - set(attributes["k8s.workload.kind"], "replicaset") where attributes["k8s.replicaset.name"] != nil and attributes["k8s.workload.kind"] == nil

      # Normalises cAdvisor Prometheus label names to OTel k8s.* semantic
      # conventions and renames metrics to dot-separated keys.
      transform/cadvisor:
        metric_statements:
          - context: resource
            statements:
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
              - set(attributes["k8s.node.name"], "${env:K8S_NODE_NAME}")
          - context: datapoint
            statements:
              - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
              - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
              - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil
              - delete_key(attributes, "namespace")
              - delete_key(attributes, "pod")
              - delete_key(attributes, "container")
              - delete_key(attributes, "image")
              - delete_key(attributes, "id")
              - delete_key(attributes, "job")
              - delete_key(attributes, "instance")
          - context: metric
            statements:
              # Names arrive without _total (stripped by Prometheus relabeling above).
              - set(name, "container.cpu.cfs.throttled.time")    where name == "container_cpu_cfs_throttled_seconds"
              - set(name, "container.cpu.cfs.throttled.periods") where name == "container_cpu_cfs_throttled_periods"
              - set(name, "container.cpu.cfs.periods")           where name == "container_cpu_cfs_periods"
              - set(name, "container.cpu.usage.cadvisor")        where name == "container_cpu_usage_seconds"

      batch:
        timeout: 10s
        send_batch_size: 1000

    exporters:
      otlphttp:
        endpoint: "${env:DT_ENDPOINT}"
        headers:
          Authorization: "${env:DT_AUTHORIZATION}"

      debug:
        verbosity: basic

    service:
      pipelines:
        metrics/kubeletstats:
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes, transform/workload_dims, batch]
          exporters: [otlphttp, debug]
        metrics/cadvisor:
          receivers: [prometheus/cadvisor]
          processors: [memory_limiter, transform/cadvisor, batch]
          exporters: [otlphttp, debug]
        # Bluebox: pod logs. k8sattributes resolves workload by k8s.pod.uid (set by the
        # container operator); not routed by the topology rule (no event.provider).
        logs/pods:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform/workload_dims, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-otelcol
  namespace: dt-otelcol
  labels:
    app: dt-otelcol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dt-otelcol
  template:
    metadata:
      labels:
        app: dt-otelcol
    spec:
      serviceAccountName: dt-otelcol
      containers:
      - name: collector
        image: ghcr.io/pawelsiwek/bluebox-otelcol-k8s:a485ff8@sha256:683e495328734b9fa13f3cf940c944e39678558fc07e42240ac51e738cd2361e
        imagePullPolicy: IfNotPresent
        args:
        - --config=/conf/deployment.yaml
        env:
        - name: DT_AUTHORIZATION
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: authorization
        - name: DT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: dt-endpoint
        - name: K8S_CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: cluster-name
        - name: K8S_CLUSTER_UID
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: cluster-uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.cluster.name=$(K8S_CLUSTER_NAME),k8s.cluster.uid=$(K8S_CLUSTER_UID)
        volumeMounts:
        - name: config
          mountPath: /conf
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: dt-otelcol-config
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dt-otelcol-agent
  namespace: dt-otelcol
  labels:
    app: dt-otelcol-agent
spec:
  selector:
    matchLabels:
      app: dt-otelcol-agent
  template:
    metadata:
      labels:
        app: dt-otelcol-agent
    spec:
      serviceAccountName: dt-otelcol
      hostNetwork: false
      containers:
      - name: collector
        image: ghcr.io/pawelsiwek/bluebox-otelcol-k8s:a485ff8@sha256:683e495328734b9fa13f3cf940c944e39678558fc07e42240ac51e738cd2361e
        imagePullPolicy: IfNotPresent
        args:
        - --config=/conf/daemonset.yaml
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - DAC_READ_SEARCH
        env:
        - name: DT_AUTHORIZATION
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: authorization
        - name: DT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: dt-endpoint
        - name: K8S_CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: cluster-name
        - name: K8S_CLUSTER_UID
          valueFrom:
            secretKeyRef:
              name: dt-otelcol-secret
              key: cluster-uid
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: config
          mountPath: /conf
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: dt-otelcol-daemonset-config
      - name: varlogpods
        hostPath:
          path: /var/log/pods
          type: Directory
