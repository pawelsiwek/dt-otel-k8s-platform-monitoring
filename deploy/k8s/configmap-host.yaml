apiVersion: v1
kind: ConfigMap
metadata:
  name: dt-otelcol-host-config
  namespace: dt-otelcol
data:
  host.yaml: |
    # OpenTelemetry Collector configuration for Dynatrace OTel Host Monitoring.
    #
    # Deployed as the `dt-otelcol-host` DaemonSet (one pod per GKE node), running
    # privileged + hostNetwork + hostPID. Collects:
    #   * host-level CPU/memory/disk/filesystem/network/process metrics via
    #     `hostmetrics` at three intervals (10s critical, 5m extended, 1h static).
    #   * systemd journal logs via `journald` from the COS in-memory journal
    #     at /run/log/journal.
    #
    # Reference: https://github.com/Dynatrace/dynatrace-otel-collector/blob/main/config_examples/host-metrics.yaml
    # Adapted for Kubernetes per https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/use-cases/host-monitoring#kubernetes-considerations
    
    receivers:
      journald:
        # GKE Container-Optimized OS keeps persistent journals under /var/log/journal
        # (with a machine-id subdir). The /run/log/journal in-memory path is empty
        # on COS, despite being the documented default elsewhere.
        directory: /var/log/journal
        priority: info
        start_at: end
        operators:
          - type: move
            from: body._PID
            to: body.pid
            if: 'body._PID != nil'
          - type: move
            from: body._EXE
            to: attributes["process.executable.name"]
            if: 'body._EXE != nil'
          - type: move
            from: body.MESSAGE
            to: body.message
            if: 'body.MESSAGE != nil'
    
      hostmetrics/10s:
        collection_interval: 10s
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
              system.cpu.time:
                enabled: false
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
              system.memory.usage:
                enabled: false
          load:
            metrics:
              system.cpu.load_average.1m:
                enabled: true
              system.cpu.load_average.5m:
                enabled: false
              system.cpu.load_average.15m:
                enabled: false
    
      hostmetrics/5m:
        collection_interval: 5m
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.time:
                enabled: true
          memory:
            metrics:
              system.memory.usage:
                enabled: true
          paging:
            metrics:
              system.paging.usage:
                enabled: true
              system.paging.operations:
                enabled: true
              system.paging.faults:
                enabled: true
          network:
            metrics:
              system.network.io:
                enabled: true
              system.network.packets:
                enabled: true
              system.network.errors:
                enabled: true
              system.network.connections:
                enabled: true
              system.network.dropped:
                enabled: true
          load:
            metrics:
              system.cpu.load_average.1m:
                enabled: false
              system.cpu.load_average.5m:
                enabled: true
              system.cpu.load_average.15m:
                enabled: true
          disk:
            metrics:
              system.disk.io:
                enabled: true
              system.disk.operations:
                enabled: true
              system.disk.io_time:
                enabled: true
              system.disk.operation_time:
                enabled: true
              system.disk.pending_operations:
                enabled: false
              system.disk.merged:
                enabled: false
              system.disk.weighted_io_time:
                enabled: false
          filesystem:
            metrics:
              system.filesystem.usage:
                enabled: true
              system.filesystem.utilization:
                enabled: true
              system.filesystem.inodes.usage:
                enabled: true
          processes:
            metrics:
              system.processes.count:
                enabled: true
              system.processes.created:
                enabled: true
          process:
            mute_process_all_errors: true
            metrics:
              process.cpu.utilization:
                enabled: true
              process.cpu.time:
                enabled: true
              process.memory.usage:
                enabled: true
              process.memory.virtual:
                enabled: true
              process.disk.io:
                enabled: true
    
      hostmetrics/1h:
        collection_interval: 1h
        root_path: /hostfs
        scrapers:
          memory:
            metrics:
              system.memory.limit:
                enabled: true
              system.memory.usage:
                enabled: false
          cpu:
            metrics:
              system.cpu.logical.count:
                enabled: true
              system.cpu.physical.count:
                enabled: true
              system.cpu.time:
                enabled: false
          system:
            metrics:
              system.uptime:
                enabled: true
    
    processors:
      memory_limiter:
        limit_mib: 256
        spike_limit_mib: 64
        check_interval: 5s
    
      filter:
        metrics:
          datapoint:
            - metric.name == "system.cpu.utilization" and attributes["state"] == "idle"
    
      resourcedetection:
        detectors: ["system"]
        system:
          resource_attributes:
            host.arch:
              enabled: true
            host.id:
              enabled: true
            host.name:
              enabled: true
            host.ip:
              enabled: true
            host.interface:
              enabled: true
            host.mac:
              enabled: true
            host.cpu.model.name:
              enabled: true
            host.cpu.vendor.id:
              enabled: false
            host.cpu.family:
              enabled: false
            host.cpu.model.id:
              enabled: false
            host.cpu.stepping:
              enabled: false
            host.cpu.cache.l2.size:
              enabled: false
            os.type:
              enabled: true
            os.description:
              enabled: true
            os.name:
              enabled: true
            os.version:
              enabled: true
            os.build.id:
              enabled: true
    
      transform:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              # Mark process metrics for deletion if the process uses less than 1 MiB of memory.
              # Filters out low-memory processes to control entity cardinality on busy nodes.
              - set(resource.attributes["low-memory-process"], "true") where metric.name == "process.memory.usage" and value_int < 1048576 and resource.attributes["process.executable.name"] != nil
          - context: resource
            statements:
              - replace_pattern(resource.attributes["process.command_line"], " ", "_")
              # host.ip is detected as an array; collapse to first element so the metric isn't dropped.
              - set(resource.attributes["host.ip"], resource.attributes["host.ip"][0]) where resource.attributes["host.ip"] != nil
              # Correlate host entities back to the k8s cluster they belong to.
              - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
              - set(attributes["k8s.cluster.uid"], "${env:K8S_CLUSTER_UID}")
              - set(attributes["k8s.node.name"], "${env:K8S_NODE_NAME}")
          - context: datapoint
            statements:
              # For process.* metrics, keep only the attributes needed by the OpenTelemetry Host extension.
              - delete_key(resource.attributes, "process.cgroup") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.command") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.executable.path") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.owner") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.parent_pid") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.pid") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.command_line") where IsMatch(metric.name, "^process\\..*")
              - delete_key(resource.attributes, "process.command_args") where IsMatch(metric.name, "^process\\..*")
              - delete_key(datapoint.attributes, "device") where datapoint.attributes["device"] == ""
              - delete_key(datapoint.attributes, "protocol") where IsMatch(metric.name, "^system\\.network\\..*")
              - delete_key(datapoint.attributes, "device") where IsMatch(metric.name, "^system\\.filesystem\\..*")
              - delete_key(datapoint.attributes, "mode") where IsMatch(metric.name, "^system\\.filesystem\\..*")
              - delete_key(datapoint.attributes, "type") where IsMatch(metric.name, "^system\\.filesystem\\..*")
          - context: metric
            statements:
              - aggregate_on_attributes("sum", ["cpu"]) where metric.name == "system.cpu.utilization"
          - context: datapoint
            statements:
              - delete_key(datapoint.attributes, "cpu") where metric.name == "system.cpu.utilization"
          - context: metric
            statements:
              # Average remaining datapoints (one per core) into a single host-level value.
              - aggregate_on_attributes("mean") where metric.name == "system.cpu.utilization"
    
      filter/delete-metrics:
        metric_conditions:
          - resource.attributes["low-memory-process"] != nil
    
      cumulativetodelta:
        max_staleness: 25h
    
      batch:
        timeout: 10s
        send_batch_size: 1000
    
    exporters:
      otlphttp:
        endpoint: "${env:DT_ENDPOINT}"
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        sending_queue:
          batch:
            min_size: 3000
            max_size: 3000
            flush_timeout: 60s
    
      # Logs require a platform token with logs.ingest scope; the metrics API token
      # cannot ingest logs. See docs/TOKEN_WORKAROUND.md.
      otlphttp/logs:
        endpoint: "${env:DT_ENDPOINT}"
        headers:
          Authorization: "Api-Token ${env:DT_PLATFORM_TOKEN}"
    
      debug:
        verbosity: basic
    
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics/10s, hostmetrics/5m, hostmetrics/1h]
          processors: [memory_limiter, filter, resourcedetection, transform, filter/delete-metrics, cumulativetodelta, batch]
          exporters: [otlphttp]
        logs:
          receivers: [journald]
          processors: [memory_limiter, resourcedetection, transform, batch]
          exporters: [otlphttp/logs]
