# Metrics routing singleton for Bluebox K8s OTel: k8s.*/container.* metrics -> metrics
# enrichment pipeline (adds dt.smartscape.custom_k8s_* IDs).
# pipelineId is a dtctl template variable (routing must reference the pipeline objectId,
# which the tenant assigns on create). Look it up by customId and pass it with --set:
#   dtctl get settings --schema builtin:openpipeline.metrics.pipelines --jq '.[] | select(.value.customId=="k8s-otel-metrics-enrichment") | .objectId'
#   dtctl apply -f dynatrace/routing-metrics.yaml --set metrics_pipeline_id=<objectId>
# Singleton is replace-all: use this file only if the tenant has no metrics routing entries
# (dtctl get settings --schema builtin:openpipeline.metrics.routing). Otherwise add the entry
# below to the existing object with dtctl edit.
- schemaId: builtin:openpipeline.metrics.routing
  scope: environment
  value:
    routingEntries:
    - enabled: true
      description: Bluebox K8s OTel - k8s.*/container.* metrics to k8s-otel-metrics-enrichment
      matcher: isNotNull(k8s.cluster.uid) and matchesValue(metric.key, {"k8s.*","container.*"})
      pipelineType: custom
      pipelineId: "{{.metrics_pipeline_id}}"
