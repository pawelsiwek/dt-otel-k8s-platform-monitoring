# Logs routing singleton for Bluebox K8s OTel: sends the collector's topology/events logs to
# the logs pipeline shipped by extension custom:dt-k8s-otel-topology. Metrics need no routing
# (the extension's ingest source claims them).
# Replace REPLACE_WITH_EXTENSION_LOGS_PIPELINE_OBJECT_ID with the objectId of the extension's
# "K8s OTel Logs: Topology + Events" pipeline, then: dtctl apply -f dynatrace/routing.yaml
# Singleton is replace-all: this file assumes the tenant has no other logs routing entries.
- schemaId: builtin:openpipeline.logs.routing
  scope: environment
  value:
    routingEntries:
    - enabled: true
      description: Bluebox K8s OTel - topology/events logs to the extension logs pipeline
      matcher: dt.openpipeline.source == "custom:dt-k8s-otel-topology" or matchesValue(event.provider, {"KUBERNETES_OTEL_TOPO","KUBERNETES_EVENT","KUBERNETES_INFERRED_EVENT","KUBERNETES_ANOMALY_DETECTION"})
      pipelineType: custom
      pipelineId: REPLACE_WITH_EXTENSION_LOGS_PIPELINE_OBJECT_ID
