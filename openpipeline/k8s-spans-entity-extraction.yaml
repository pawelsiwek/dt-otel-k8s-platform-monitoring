# OpenPipeline spans pipeline — entity extraction + enrichment for OTel k8s.* spans
#
# Extracts Smartscape nodes and edges from incoming OTel trace spans that carry
# k8s semantic-convention attributes (set by the k8sattributes processor or by
# instrumentation agents).
#
# Entity types extracted:
#   CUSTOM_K8S_CLUSTER, CUSTOM_K8S_NAMESPACE, CUSTOM_K8S_NODE,
#   CUSTOM_K8S_DEPLOYMENT, CUSTOM_K8S_DAEMONSET, CUSTOM_K8S_STATEFULSET,
#   CUSTOM_K8S_REPLICASET, CUSTOM_K8S_POD, CUSTOM_CONTAINER
#
# Note on workload attributes in spans:
#   - Standard OTel SDK spans carry k8s.deployment.name (no k8s.workload.name)
#   - DT OTel agent spans carry k8s.workload.name/kind but NOT k8s.deployment.name
#   Workload-type processors (deployment/daemonset/…) fire only when the respective
#   k8s.*.<type>.name attribute is set. Cluster/namespace/node/pod/container
#   extraction works for all span sources.
#
# Note: k8s.service.name is NOT a standard span attribute (spans use service.name
# for the OTel service, not the k8s Service object). Service extraction is omitted.
#
# idComponents are identical to k8s-topology-combined-pipeline.yaml and
# k8s-metrics-entity-extraction.yaml so extracted entities resolve to the same
# Smartscape IDs across all three pipelines.
#
# Apply: dtctl apply -f openpipeline/k8s-spans-entity-extraction.yaml --plain
# (objectId is filled in after first apply and committed back)

---
type: setting
schemaId: builtin:openpipeline.spans.pipelines
scope: environment
objectId: "vu9U3hXa3q0AAAABACRidWlsdGluOm9wZW5waXBlbGluZS5zcGFucy5waXBlbGluZXMABnRlbmFudAAGdGVuYW50ACQ1YmNlNDQ0Mi01ZjFkLTM0ZWQtYWZlMy0zNGJlNDM1MmYyZDi-71TeFdrerQ"
value:
  customId: k8s-otel-spans-entity-extraction
  displayName: "K8s OTel Spans: Entity Extraction + Enrichment"
  metadataList: []
  smartscapeNodeExtraction:
    processors:
      # ── 1. CLUSTER ─────────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-cluster
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_CLUSTER from spans"
        matcher: 'isNotNull(k8s.cluster.uid)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_CLUSTER
          nodeIdFieldName: dt.smartscape.custom_k8s_cluster
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.cluster.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
          staticEdgesToExtract: []

      # ── 2. NAMESPACE ───────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-namespace
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_NAMESPACE from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_NAMESPACE
          nodeIdFieldName: dt.smartscape.custom_k8s_namespace
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.namespace.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.cluster.uid
              referencedFieldName: k8s.cluster.uid
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster

      # ── 3. NODE ────────────────────────────────────────────────────────────
      # Note: k8s.node.system_uuid is not typically present on span attributes.
      - type: smartscapeNode
        id: extract-k8s-node
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_NODE from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.node.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_NODE
          nodeIdFieldName: dt.smartscape.custom_k8s_node
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: node_name
              referencedFieldName: k8s.node.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.node.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.cluster.uid
              referencedFieldName: k8s.cluster.uid
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster

      # ── 4. DEPLOYMENT ──────────────────────────────────────────────────────
      # Fires for standard OTel SDK spans that carry k8s.deployment.name.
      # DT OTel agent spans use k8s.workload.name/kind instead — those will NOT
      # match here (k8s.deployment.name is null for agent spans).
      - type: smartscapeNode
        id: extract-k8s-deployment
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_DEPLOYMENT from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.deployment.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_DEPLOYMENT
          nodeIdFieldName: dt.smartscape.custom_k8s_deployment
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: deployment_name
              referencedFieldName: k8s.deployment.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.deployment.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 5. DAEMONSET ───────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-daemonset
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_DAEMONSET from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.daemonset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_DAEMONSET
          nodeIdFieldName: dt.smartscape.custom_k8s_daemonset
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: daemonset_name
              referencedFieldName: k8s.daemonset.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.daemonset.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 6. STATEFULSET ─────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-statefulset
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_STATEFULSET from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.statefulset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_STATEFULSET
          nodeIdFieldName: dt.smartscape.custom_k8s_statefulset
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: statefulset_name
              referencedFieldName: k8s.statefulset.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.statefulset.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 7. REPLICASET ──────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-replicaset
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_REPLICASET from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.replicaset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_REPLICASET
          nodeIdFieldName: dt.smartscape.custom_k8s_replicaset
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: replicaset_name
              referencedFieldName: k8s.replicaset.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.replicaset.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 8. POD ─────────────────────────────────────────────────────────────
      # Runs after workload processors so dt.smartscape.custom_k8s_<workload>
      # is already written. is_part_of edges fire only for whichever workload
      # type has a non-null dt.smartscape.* field; others are silently no-ops.
      - type: smartscapeNode
        id: extract-k8s-pod
        enabled: true
        description: "Extract/enrich CUSTOM_K8S_POD from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.pod.uid)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_POD
          nodeIdFieldName: dt.smartscape.custom_k8s_pod
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: pod_uid
              referencedFieldName: k8s.pod.uid
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.pod.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
            - fieldName: k8s.node.name
              referencedFieldName: k8s.node.name
              strategy: equals
            - fieldName: k8s.workload.name
              referencedFieldName: k8s.workload.name
              strategy: equals
            - fieldName: k8s.workload.kind
              referencedFieldName: k8s.workload.kind
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace
            - edgeType: runs_on
              targetType: CUSTOM_K8S_NODE
              targetIdFieldName: dt.smartscape.custom_k8s_node
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_DEPLOYMENT
              targetIdFieldName: dt.smartscape.custom_k8s_deployment
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_STATEFULSET
              targetIdFieldName: dt.smartscape.custom_k8s_statefulset
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_DAEMONSET
              targetIdFieldName: dt.smartscape.custom_k8s_daemonset
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_REPLICASET
              targetIdFieldName: dt.smartscape.custom_k8s_replicaset

      # ── 9. CONTAINER ───────────────────────────────────────────────────────
      # Runs after pod so dt.smartscape.custom_k8s_pod is already written.
      # k8s.container.image is not typically carried in spans; if absent the
      # field is simply not written.
      - type: smartscapeNode
        id: extract-custom-container
        enabled: true
        description: "Extract/enrich CUSTOM_CONTAINER from spans"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.pod.uid) and isNotNull(k8s.container.name)'
        smartscapeNode:
          nodeType: CUSTOM_CONTAINER
          nodeIdFieldName: dt.smartscape.custom_container
          extractNode: true
          idComponents:
            - idComponent: pod_uid
              referencedFieldName: k8s.pod.uid
            - idComponent: container_name
              referencedFieldName: k8s.container.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.container.name
          fieldsToExtract:
            - fieldName: k8s.container.name
              referencedFieldName: k8s.container.name
              strategy: equals
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
            - fieldName: k8s.pod.name
              referencedFieldName: k8s.pod.name
              strategy: equals
            - fieldName: k8s.node.name
              referencedFieldName: k8s.node.name
              strategy: equals
            - fieldName: k8s.workload.name
              referencedFieldName: k8s.workload.name
              strategy: equals
            - fieldName: k8s.workload.kind
              referencedFieldName: k8s.workload.kind
              strategy: equals
            - fieldName: k8s.container.image
              referencedFieldName: k8s.container.image
              strategy: equals
          staticEdgesToExtract:
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_POD
              targetIdFieldName: dt.smartscape.custom_k8s_pod
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace
            - edgeType: runs_on
              targetType: CUSTOM_K8S_NODE
              targetIdFieldName: dt.smartscape.custom_k8s_node
