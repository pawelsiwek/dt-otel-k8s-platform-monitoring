# OpenPipeline metric pipeline — entity enrichment for OTel k8s.* metrics
#
# Associates CUSTOM_K8S_* Smartscape entities with ingested OTel metric data points
# so that DQL timeseries queries using dt.smartscape.* dimensions return results.
#
# extractNode: false → look up existing entity and enrich the metric; do NOT create
# new entity records from metric data points.
#
# idComponents must exactly match the corresponding smartscapeNodeExtraction rules
# in k8s-topology-combined-pipeline.yaml so the same entity is resolved.
#
# Apply: dtctl apply -f openpipeline/k8s-metrics-entity-enrichment.yaml

---
type: setting
schemaId: builtin:openpipeline.metrics.pipelines
scope: environment
objectId: "vu9U3hXa3q0AAAABACZidWlsdGluOm9wZW5waXBlbGluZS5tZXRyaWNzLnBpcGVsaW5lcwAGdGVuYW50AAZ0ZW5hbnQAJDU0Yjk3ZGE0LTFiMzQtMzIwNi04MGZlLTI3NmI0NGNiM2IzYr7vVN4V2t6t"
value:
  customId: k8s-otel-metrics-entity-enrichment
  displayName: "K8s OTel Metrics: Entity Enrichment"
  metadataList: []
  smartscapeNodeExtraction:
    processors:
      - type: smartscapeNode
        id: enrich-k8s-cluster
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_CLUSTER entity"
        matcher: 'isNotNull(k8s.cluster.uid)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_CLUSTER
          nodeIdFieldName: dt.smartscape.custom_k8s_cluster
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-namespace
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_NAMESPACE entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_NAMESPACE
          nodeIdFieldName: dt.smartscape.custom_k8s_namespace
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-node
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_NODE entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.node.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_NODE
          nodeIdFieldName: dt.smartscape.custom_k8s_node
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: node_name
              referencedFieldName: k8s.node.name
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-pod
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_POD entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.pod.uid)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_POD
          nodeIdFieldName: dt.smartscape.custom_k8s_pod
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: pod_uid
              referencedFieldName: k8s.pod.uid
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-deployment
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_DEPLOYMENT entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.deployment.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_DEPLOYMENT
          nodeIdFieldName: dt.smartscape.custom_k8s_deployment
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: deployment_name
              referencedFieldName: k8s.deployment.name
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-daemonset
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_DAEMONSET entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.daemonset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_DAEMONSET
          nodeIdFieldName: dt.smartscape.custom_k8s_daemonset
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: daemonset_name
              referencedFieldName: k8s.daemonset.name
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-statefulset
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_STATEFULSET entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.statefulset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_STATEFULSET
          nodeIdFieldName: dt.smartscape.custom_k8s_statefulset
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: statefulset_name
              referencedFieldName: k8s.statefulset.name
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-k8s-replicaset
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_REPLICASET entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.replicaset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_REPLICASET
          nodeIdFieldName: dt.smartscape.custom_k8s_replicaset
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: replicaset_name
              referencedFieldName: k8s.replicaset.name
          fieldsToExtract: []
          staticEdgesToExtract: []

      - type: smartscapeNode
        id: enrich-custom-container
        enabled: true
        description: "Extract/enrich CUSTOM_CONTAINER from container metrics (minimal node; image enriched by dtk8stopology)"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.pod.uid) and isNotNull(k8s.container.name)'
        smartscapeNode:
          nodeType: CUSTOM_CONTAINER
          nodeIdFieldName: dt.smartscape.custom_container
          extractNode: true
          idComponents:
            - idComponent: pod_uid
              referencedFieldName: k8s.pod.uid
            - idComponent: container_name
              referencedFieldName: k8s.container.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.container.name
          fieldsToExtract:
            - fieldName: k8s.container.name
              referencedFieldName: k8s.container.name
              strategy: equals
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
            - fieldName: k8s.node.name
              referencedFieldName: k8s.node.name
              strategy: equals
            - fieldName: k8s.workload.name
              referencedFieldName: k8s.workload.name
              strategy: equals
            - fieldName: k8s.workload.kind
              referencedFieldName: k8s.workload.kind
              strategy: equals
          staticEdgesToExtract:
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_POD
              targetIdFieldName: dt.smartscape.custom_k8s_pod
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace
            - edgeType: runs_on
              targetType: CUSTOM_K8S_NODE
              targetIdFieldName: dt.smartscape.custom_k8s_node

      - type: smartscapeNode
        id: enrich-k8s-service
        enabled: true
        description: "Enrich metrics with CUSTOM_K8S_SERVICE entity"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.service.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_SERVICE
          nodeIdFieldName: dt.smartscape.custom_k8s_service
          extractNode: false
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: service_name
              referencedFieldName: k8s.service.name
          fieldsToExtract: []
          staticEdgesToExtract: []
