# Phase F: OpenPipeline metric-extraction rule for dt.kubernetes.events.
#
# Adds a counterMetric processor to the existing k8s-otel-topology pipeline.
# Every KUBERNETES_EVENT log record that flows through that pipeline increments
# the dt.kubernetes.events counter with three dimensions:
#   dt.kubernetes.event.reason          (e.g. "Pulled", "FailedScheduling")
#   dt.kubernetes.event.type            (Normal → INFO, Warning → ERROR)
#   dt.kubernetes.event.involved_object.kind  (Pod, Node, Deployment, …)
#
# Apply via:
#   dtctl settings put --schema builtin:openpipeline.logs.pipelines \
#       --scope environment --file openpipeline/kubernetes-events-metric.yaml
#
# The pipelineId must match the existing k8s-otel-topology custom pipeline ID.
type: setting
schemaId: builtin:openpipeline.logs.pipelines
scope: environment
value:
  customId: k8s-otel-events-metric
  displayName: "K8s OTel Events: kubernetes.events counter metric"
  metadataList: []
  metricExtraction:
    processors:
      - type: counterMetric
        id: count-kubernetes-events
        enabled: true
        description: "Count KUBERNETES_EVENT log records into kubernetes.events metric"
        matcher: 'event.provider == "KUBERNETES_EVENT"'
        counterMetric:
          metricKey: kubernetes.events
          dimensions:
            - strategy: equals
              extractionType: field
              sourceFieldName: dt.kubernetes.event.reason
              destinationFieldName: dt.kubernetes.event.reason
            - strategy: equals
              extractionType: field
              sourceFieldName: event.category
              destinationFieldName: dt.kubernetes.event.type
            - strategy: equals
              extractionType: field
              sourceFieldName: dt.kubernetes.event.involved_object.kind
              destinationFieldName: dt.kubernetes.event.involved_object.kind
            - strategy: equals
              extractionType: field
              sourceFieldName: k8s.cluster.name
              destinationFieldName: k8s.cluster.name
  storage:
    processors:
      - type: bucketAssignment
        id: store-events-default
        enabled: true
        description: "Store K8s events in default logs bucket"
        matcher: "true"
        bucketAssignment:
          bucketName: default_logs
