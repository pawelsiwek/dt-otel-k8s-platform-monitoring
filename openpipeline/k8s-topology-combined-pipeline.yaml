type: setting
schemaId: builtin:openpipeline.logs.pipelines
scope: environment
objectId: "vu9U3hXa3q0AAAABACNidWlsdGluOm9wZW5waXBlbGluZS5sb2dzLnBpcGVsaW5lcwAGdGVuYW50AAZ0ZW5hbnQAJDkwYTdhNjAyLWM0YmMtMzYwZC1hODFhLWQxY2M2MDY2YTE3OL7vVN4V2t6t"
value:
  customId: k8s-otel-topology
  displayName: "K8s OTel Topology: All Entity Types"
  metadataList: []
  smartscapeNodeExtraction:
    processors:
      # ── 1. CLUSTER ─────────────────────────────────────────────────────────
      # Runs on every topology event (all carry k8s.cluster.uid).
      # Writes dt.smartscape.custom_k8s_cluster so later processors can reference it.
      - type: smartscapeNode
        id: extract-k8s-cluster
        enabled: true
        description: "Extract K8S_CLUSTER from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_CLUSTER
          nodeIdFieldName: dt.smartscape.custom_k8s_cluster
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.cluster.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
          staticEdgesToExtract: []

      # ── 2. NAMESPACE ───────────────────────────────────────────────────────
      # Runs on namespace events and any event enriched with k8s.namespace.uid
      # (pod, container, deployment, daemonset events carry it from the cache).
      # Writes dt.smartscape.custom_k8s_namespace.
      - type: smartscapeNode
        id: extract-k8s-namespace
        enabled: true
        description: "Extract K8S_NAMESPACE from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_NAMESPACE
          nodeIdFieldName: dt.smartscape.custom_k8s_namespace
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.namespace.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.cluster.uid
              referencedFieldName: k8s.cluster.uid
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster

      # ── 3. NODE ────────────────────────────────────────────────────────────
      # Runs on node events and any event enriched with k8s.node.uid from cache
      # (pod and container events carry it).
      # Writes dt.smartscape.custom_k8s_node.
      - type: smartscapeNode
        id: extract-k8s-node
        enabled: true
        description: "Extract K8S_NODE from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.node.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_NODE
          nodeIdFieldName: dt.smartscape.custom_k8s_node
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: node_name
              referencedFieldName: k8s.node.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.node.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.cluster.uid
              referencedFieldName: k8s.cluster.uid
              strategy: equals
            - fieldName: k8s.node.system_uuid
              referencedFieldName: k8s.node.system_uuid
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster

      # ── 4. DEPLOYMENT ──────────────────────────────────────────────────────
      # Runs on K8S_DEPLOYMENT events and on pod events that carry k8s.deployment.name
      # (After Phase 1 Go change: pod events owned by a Deployment will have it).
      # Writes dt.smartscape.custom_k8s_deployment for the pod→workload is_part_of edge.
      - type: smartscapeNode
        id: extract-k8s-deployment
        enabled: true
        description: "Extract K8S_DEPLOYMENT from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.deployment.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_DEPLOYMENT
          nodeIdFieldName: dt.smartscape.custom_k8s_deployment
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: deployment_name
              referencedFieldName: k8s.deployment.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.deployment.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 5. STATEFULSET ─────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-statefulset
        enabled: true
        description: "Extract K8S_STATEFULSET from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.statefulset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_STATEFULSET
          nodeIdFieldName: dt.smartscape.custom_k8s_statefulset
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: statefulset_name
              referencedFieldName: k8s.statefulset.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.statefulset.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 6. DAEMONSET ───────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-daemonset
        enabled: true
        description: "Extract K8S_DAEMONSET from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.daemonset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_DAEMONSET
          nodeIdFieldName: dt.smartscape.custom_k8s_daemonset
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: daemonset_name
              referencedFieldName: k8s.daemonset.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.daemonset.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 7. REPLICASET ──────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-replicaset
        enabled: true
        description: "Extract K8S_REPLICASET from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.replicaset.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_REPLICASET
          nodeIdFieldName: dt.smartscape.custom_k8s_replicaset
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: replicaset_name
              referencedFieldName: k8s.replicaset.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.replicaset.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

      # ── 8. POD ─────────────────────────────────────────────────────────────
      # Runs after all workload processors so dt.smartscape.custom_k8s_<workload>
      # is already written by whichever workload processor fired on this event.
      # is_part_of edges: only the workload whose dt.smartscape.* field is
      # non-null (i.e., the pod's top controller) produces an edge; others no-op.
      - type: smartscapeNode
        id: extract-k8s-pod
        enabled: true
        description: "Extract K8S_POD from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.pod.uid)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_POD
          nodeIdFieldName: dt.smartscape.custom_k8s_pod
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: pod_uid
              referencedFieldName: k8s.pod.uid
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.pod.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
            - fieldName: k8s.node.name
              referencedFieldName: k8s.node.name
              strategy: equals
            - fieldName: k8s.pod.phase
              referencedFieldName: k8s.pod.phase
              strategy: equals
            - fieldName: k8s.workload.name
              referencedFieldName: k8s.workload.name
              strategy: equals
            - fieldName: k8s.workload.kind
              referencedFieldName: k8s.workload.kind
              strategy: equals
            - fieldName: k8s.object
              referencedFieldName: k8s.object
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace
            - edgeType: runs_on
              targetType: CUSTOM_K8S_NODE
              targetIdFieldName: dt.smartscape.custom_k8s_node
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_DEPLOYMENT
              targetIdFieldName: dt.smartscape.custom_k8s_deployment
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_STATEFULSET
              targetIdFieldName: dt.smartscape.custom_k8s_statefulset
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_DAEMONSET
              targetIdFieldName: dt.smartscape.custom_k8s_daemonset
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_REPLICASET
              targetIdFieldName: dt.smartscape.custom_k8s_replicaset

      # ── 9. CONTAINER ───────────────────────────────────────────────────────
      # Runs after pod so dt.smartscape.custom_k8s_pod is already written.
      - type: smartscapeNode
        id: extract-container
        enabled: true
        description: "Extract CONTAINER from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.pod.uid) and isNotNull(k8s.container.name)'
        smartscapeNode:
          nodeType: CUSTOM_CONTAINER
          nodeIdFieldName: dt.smartscape.custom_container
          extractNode: true
          idComponents:
            - idComponent: pod_uid
              referencedFieldName: k8s.pod.uid
            - idComponent: container_name
              referencedFieldName: k8s.container.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.container.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
            - fieldName: k8s.pod.name
              referencedFieldName: k8s.pod.name
              strategy: equals
            - fieldName: k8s.node.name
              referencedFieldName: k8s.node.name
              strategy: equals
            - fieldName: k8s.container.name
              referencedFieldName: k8s.container.name
              strategy: equals
            - fieldName: k8s.container.image
              referencedFieldName: k8s.container.image
              strategy: equals
            - fieldName: k8s.workload.name
              referencedFieldName: k8s.workload.name
              strategy: equals
            - fieldName: k8s.workload.kind
              referencedFieldName: k8s.workload.kind
              strategy: equals
          staticEdgesToExtract:
            - edgeType: is_part_of
              targetType: CUSTOM_K8S_POD
              targetIdFieldName: dt.smartscape.custom_k8s_pod
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace
            - edgeType: runs_on
              targetType: CUSTOM_K8S_NODE
              targetIdFieldName: dt.smartscape.custom_k8s_node

      # ── 10. SERVICE ────────────────────────────────────────────────────────
      - type: smartscapeNode
        id: extract-k8s-service
        enabled: true
        description: "Extract K8S_SERVICE from KUBERNETES_OTEL_TOPO events"
        matcher: 'isNotNull(k8s.cluster.uid) and isNotNull(k8s.namespace.name) and isNotNull(k8s.service.name)'
        smartscapeNode:
          nodeType: CUSTOM_K8S_SERVICE
          nodeIdFieldName: dt.smartscape.custom_k8s_service
          extractNode: true
          idComponents:
            - idComponent: cluster_uid
              referencedFieldName: k8s.cluster.uid
            - idComponent: namespace_name
              referencedFieldName: k8s.namespace.name
            - idComponent: service_name
              referencedFieldName: k8s.service.name
          nodeName:
            type: field
            field:
              sourceFieldName: k8s.service.name
          fieldsToExtract:
            - fieldName: k8s.cluster.name
              referencedFieldName: k8s.cluster.name
              strategy: equals
            - fieldName: k8s.namespace.name
              referencedFieldName: k8s.namespace.name
              strategy: equals
          staticEdgesToExtract:
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_CLUSTER
              targetIdFieldName: dt.smartscape.custom_k8s_cluster
            - edgeType: belongs_to
              targetType: CUSTOM_K8S_NAMESPACE
              targetIdFieldName: dt.smartscape.custom_k8s_namespace

  storage:
    processors:
      - type: bucketAssignment
        id: store-default-logs
        enabled: true
        description: "Store K8s topology events in default logs bucket"
        matcher: "true"
        bucketAssignment:
          bucketName: default_logs
