# OpenPipeline metrics routing — extension extraction mode
#
# Routes OTel k8s.* metrics to the entity extraction pipeline bundled in the
# custom:dt-k8s-otel-topology extension (customId: k8s-otel-entity-extraction).
# The pipeline creates K8S_* Smartscape entities and writes dt.smartscape.k8s_*
# entity-ID fields onto each matching data point.
#
# Applied when METRICS_EXTRACT=true via:
#   make apply-openpipeline METRICS_EXTRACT=true
#
# Note: objectId is shared with k8s-metrics-routing.yaml so applying this
# file replaces the routing entry in-place.
# The extension must be installed and active before applying this routing.
type: setting
schemaId: builtin:openpipeline.metrics.routing
scope: environment
objectId: "vu9U3hXa3q0AAAABACRidWlsdGluOm9wZW5waXBlbGluZS5tZXRyaWNzLnJvdXRpbmcABnRlbmFudAAGdGVuYW50ACRlYTdhMzgyYy1jYTA3LTM2YTQtOGE4ZC0zOTFhMTk0YzQwNzO-71TeFdrerQ"
value:
  routingEntries:
    - description: "Route OTel k8s metrics through extension extraction pipeline"
      enabled: true
      matcher: 'isNotNull(k8s.cluster.uid)'
      pipelineType: custom
      pipelineId: "vu9U3hXa3q0AAAABACZidWlsdGluOm9wZW5waXBlbGluZS5tZXRyaWNzLnBpcGVsaW5lcwAGdGVuYW50AAZ0ZW5hbnQAJDRiNDgwOTllLTQ0ZTYtM2YxMi05NDBmLTU5M2UzMjI2NmZhMr7vVN4V2t6t"
